<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#4f46e5" />
<title>Menus &amp; Courses</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root { --indigo:#4f46e5; --indigo-dark:#3730a3; --bg:#f5f5f4; --card:#ffffff; --txt:#1c1917; --muted:#78716c; --line:#e7e5e4; --green:#059669; --amber:#d97706; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); max-width:480px; margin:0 auto; min-height:100vh; }
  header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:19px; font-weight:800; }
  header .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .avatars { display:flex; }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; border:2px solid #fff; }
  .avatar+ .avatar { margin-left:-8px; }
  main { padding:12px 14px; }
  .btn { border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:600; cursor:pointer; width:100%; }
  .btn-primary { background:var(--indigo); color:#fff; box-shadow:0 6px 16px rgba(79,70,229,.25); }
  .btn-ghost { background:#fff; color:var(--muted); border:1px solid var(--line); }
  .pill { font-size:10px; padding:3px 8px; border-radius:99px; font-weight:600; display:inline-block; }
  .pill.on { outline:2px solid currentColor; outline-offset:1px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; }
  .dayrow { display:grid; grid-template-columns:52px 1fr 1fr; gap:6px; margin-bottom:6px; align-items:stretch; }
  .daylbl { font-size:11px; font-weight:700; color:var(--muted); display:flex; align-items:center; justify-content:center; background:#fafaf9; border-radius:10px; }
  .cell { min-height:52px; border-radius:10px; border:none; font-size:10px; font-weight:600; cursor:pointer; padding:5px; text-align:left; line-height:1.2; overflow:hidden; }
  .cell.empty { border:2px dashed var(--line); color:#d6d3d1; display:flex; align-items:center; justify-content:center; font-size:18px; background:transparent; }
  .cell.filled { background:#eef2ff; color:#3730a3; }
  .cell.special { background:#f5f3ff; color:#6d28d9; }
  .cell.nobody { background:#f5f5f4; color:#a8a29e; display:flex; align-items:center; justify-content:center; }
  .cell .who { display:block; font-size:8.5px; color:var(--muted); font-weight:500; }
  nav.top { position:sticky; top:0; z-index:25; width:100%; max-width:480px; background:#fff; border-bottom:1px solid var(--line); display:flex; }
  nav.top button { flex:1; padding:8px 0 10px; background:none; border:none; font-size:10.5px; font-weight:600; color:#a8a29e; cursor:pointer; }
  nav.top button.on { color:var(--indigo); }
  nav.top button .ic { display:block; font-size:19px; margin:0 auto 2px; width:fit-content; }
  .sheet-bkg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 18px 26px; max-height:86vh; overflow-y:auto; }
  .sheet h3 { font-size:17px; font-weight:800; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .sheet .close { background:none; border:none; font-size:18px; color:var(--muted); cursor:pointer; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; }
  .field { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:14px; font-family:inherit; background:#fff; }
  .field:focus { outline:none; border-color:var(--indigo); }
  .lbl { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 6px; }
  .person { flex:1; border:1.5px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center; font-size:11.5px; font-weight:600; background:#fff; cursor:pointer; color:var(--muted); font-family:inherit; }
  .person.on { background:#eef2ff; border-color:var(--indigo); color:var(--indigo); }
  .person .e { font-size:17px; display:block; }
  .person .p { font-size:9px; display:block; opacity:.7; }
  .optline { border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:9px 12px; font-size:13px; font-weight:600; color:var(--txt); margin-bottom:8px; cursor:pointer; display:block; width:100%; text-align:left; font-family:inherit; }
  .tagrow { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .checker { width:24px; height:24px; border-radius:8px; border:2px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; flex-shrink:0; }
  .checker.on { background:var(--green); border-color:var(--green); }
  .item { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .item.done { opacity:.4; }
  .item.done .nm { text-decoration:line-through; }
  .syncbar { position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:60; background:#065f46; color:#fff; font-size:11px; font-weight:600; padding:5px 14px; border-radius:0 0 12px 12px; display:none; }
  .hidden { display:none !important; }
  .stepper { display:flex; align-items:center; gap:14px; }
  .stepper button { width:38px; height:38px; border-radius:50%; border:none; background:#fff; font-size:20px; font-weight:700; color:var(--indigo); box-shadow:0 1px 4px rgba(0,0,0,.15); cursor:pointer; }
  .stepper .val { font-size:22px; font-weight:800; width:52px; text-align:center; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1c1917; color:#fff; font-size:12.5px; font-weight:600; padding:10px 18px; border-radius:99px; z-index:70; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center; }
</style>
</head>
<body>
<div class="syncbar" id="syncbar">Hors ligne — les modifications seront synchronisées au retour du réseau</div>
<header>
  <div>
    <h1 id="h-title">Planning</h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div class="avatars" id="h-avatars"></div>
</header>
<nav class="top" id="nav"></nav>
<main id="app"></main>
<div id="sheet-holder"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   MENUS & COURSES — v1.2 (application réelle)
   Fichier unique : déployable sur GitHub Pages.
   - Mode LOCAL : fonctionne immédiatement (localStorage).
   - Mode PARTAGÉ : renseigner SUPABASE_URL et SUPABASE_ANON_KEY
     ci-dessous (créés sur supabase.com, guide fourni) →
     synchronisation temps réel entre Gabriel et sa compagne.
   ============================================================ */

const SUPABASE_URL = "https://dqztmfrjohbiyohvicemq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5Vch5zEymP-ExqRat4VvmA_eVuHHDEE";
const APP_VERSION = "1.4";
const FOYER = "CADOUX";         // code foyer : ta compagne utilisera le même

// ---------- Constantes métier ----------
const PERSONNES = [
  { id:"gabriel",   label:"Gabriel",   emoji:"👨", parts:1 },
  { id:"compagne",  label:"Compagne",  emoji:"👩", parts:1 },
  { id:"raphaelle", label:"Raphaëlle", emoji:"👧", parts:0.5 },
];
const TAGS = {
  vege:       { label:"Végétarien",    css:"background:#d1fae5;color:#047857" },
  rapide:     { label:"Rapide <30min", css:"background:#fef3c7;color:#b45309" },
  viande:     { label:"Viande",        css:"background:#ffe4e6;color:#be123c" },
  poisson:    { label:"Poisson",       css:"background:#e0f2fe;color:#0369a1" },
  hiver:      { label:"Hiver",         css:"background:#e0e7ff;color:#4338ca" },
  ete:        { label:"Été",            css:"background:#ecfccb;color:#4d7c0f" },
  automne:    { label:"Automne",       css:"background:#ffedd5;color:#c2410c" },
  printemps:  { label:"Printemps",     css:"background:#dcfce7;color:#15803d" },
  dessert:    { label:"Dessert",       css:"background:#fce7f3;color:#be185d" },
  favoris:    { label:"⭐ Favoris",    css:"background:#fef9c3;color:#a16207" },
};
const CATS = [
  { id:"legumes", label:"Légumes & Fruits",   emoji:"🥕" },
  { id:"viande",  label:"Viande & Poisson",   emoji:"🥩" },
  { id:"laitage", label:"Laitage & Crèmerie", emoji:"🧀" },
  { id:"secs",    label:"Produits secs",      emoji:"🥜" },
  { id:"menage",  label:"Ménage",            emoji:"🧹" },
  { id:"hygiene", label:"Hygiène",           emoji:"🧼" },
  { id:"bebe",    label:"Bébé",               emoji:"🍼" },
  { id:"autres",  label:"Autres",             emoji:"📦" },
];

// ---------- État & persistance ----------
// Stockage sûr : localStorage si disponible, sinon mémoire (aperçus sandboxés)
const LS_KEY = "menus-courses-" + FOYER;
const memStore = {};
function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return memStore[k] || null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e) { memStore[k]=v; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e) { delete memStore[k]; } }
if (typeof structuredClone !== "function") {
  window.structuredClone = (o) => JSON.parse(JSON.stringify(o));
}
const DEFAULT_STATE = {
  weekStart: null,   // "YYYY-MM-DD" du premier jour du planning
  meals: {},         // "YYYY-MM-DD|midi" ou "|soir" → {recetteId, convives[], special}
  extras: [],        // plats hors planning [{id, nom}]
  recipes: [],
  list: [],          // [{id, cat, nom, qte, checked, home}]
  settings: {},      // {mistralKey}
};
let S = loadState();
let nav = "planning";

function loadState() {
  try {
    const raw = lsGet(LS_KEY);
    if (raw) return Object.assign(structuredClone(DEFAULT_STATE), JSON.parse(raw));
  } catch(e) {}
  const st = structuredClone(DEFAULT_STATE);
  st.weekStart = todayISO();
  return st;
}
function save() {
  lsSet(LS_KEY, JSON.stringify(S));
  schedulePush();
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtD(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("fr-FR", { weekday:"short", day:"numeric" });
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------- Rendu ----------
function render() {
  document.getElementById("nav").innerHTML = [
    ["planning","🗓️","Planning"],
    ["recettes","👨‍🍳","Recettes"],
    ["courses","🛒","Courses"],
    ["reglages","⚙️","Réglages"],
  ].map(([id,ic,lb]) => `<button class="${nav===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span>${lb}</button>`).join("");

  const titles = {
    planning:["Planning de la semaine", "Le point de départ : organisez les repas"],
    recettes:["Mes recettes", S.recipes.length + " recette(s) · modifiables"],
    courses:["Liste de courses", "Cochez en magasin — fonctionne hors ligne"],
    reglages:["Réglages", "Foyer, synchronisation, données"],
  };
  document.getElementById("h-title").textContent = titles[nav][0];
  document.getElementById("h-sub").textContent = titles[nav][1];
  document.getElementById("h-avatars").innerHTML =
    `<div class="avatar" style="background:#6366f1">GC</div><div class="avatar" style="background:#fb7185">C</div>`;

  const app = document.getElementById("app");
  if (nav==="planning") renderPlanning(app);
  else if (nav==="recettes") renderRecettes(app);
  else if (nav==="courses") renderCourses(app);
  else renderReglages(app);
}
function go(id) { nav = id; closeSheet(); render(); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.opacity = 0; }, 2600);
}
function closeSheet() { document.getElementById("sheet-holder").innerHTML = ""; }
function openSheet(html) {
  document.getElementById("sheet-holder").innerHTML =
    `<div class="sheet-bkg" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`;
}

// ============================================================
// PLANNING
// ============================================================
function renderPlanning(el) {
  const start = S.weekStart || todayISO();
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(start + "T12:00:00"); d.setDate(d.getDate()+i);
    return d.toISOString().slice(0,10);
  });
  const rows = days.map(d=>`
    <div class="dayrow">
      <div class="daylbl">${fmtD(d)}</div>
      ${mealCell(d,"midi")}
      ${mealCell(d,"soir")}
    </div>`).join("");

  el.innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <span style="font-size:12px;color:var(--muted)">Semaine à partir du</span>
      <input type="date" class="field grow" style="padding:6px 10px;font-size:13px" value="${start}"
             onchange="setWeekStart(this.value)">
    </div>
    ${rows}
    <div class="lbl" style="margin-top:14px">Hors planning (gâteau, invités…)</div>
    ${S.extras.map(x=>`
      <div class="row card" style="justify-content:space-between;padding:9px 12px;margin-bottom:8px">
        <span style="font-size:13px">🍰 ${esc(x.nom)}</span>
        <span>
          <button class="optline" style="display:inline-block;width:auto;padding:4px 10px;font-size:11px;margin:0;color:#b45309" onclick="extraToList('${x.id}')">+ courses</button>
          <button class="optline" style="display:inline-block;width:auto;padding:4px 9px;font-size:11px;margin:0 0 0 4px;color:#a8a29e" onclick="delExtra('${x.id}')">✕</button>
        </span>
      </div>`).join("")}
    <button class="optline" style="border-style:dashed;color:#a8a29e;text-align:center" onclick="askExtra()">+ Ajouter un plat hors planning</button>
    <div style="height:14px"></div>
    <button class="btn btn-primary" onclick="generateList()">✨ Générer la liste de courses</button>
    <p style="font-size:10px;color:#a8a29e;text-align:center;margin-top:8px">
      Chaque nouveau planning lance une nouvelle liste.<br>Les articles non cochés seront reportés automatiquement.
    </p>`;
}
function setWeekStart(v){ if(v){ S.weekStart = v; save(); render(); } }
function mealCell(d, repas) {
  const key = d + "|" + repas;
  const m = S.meals[key];
  if (!m) return `<button class="cell empty" onclick="editMeal('${d}','${repas}')">+</button>`;
  if (!m.convives || m.convives.length===0)
    return `<button class="cell nobody" onclick="editMeal('${d}','${repas}')">vide</button>`;
  const parts = partsOf(m.convives);
  if (m.special)
    return `<button class="cell special" onclick="editMeal('${d}','${repas}')">🎉 ${esc(m.special)}<span class="who">${parts} pers.</span></button>`;
  const r = S.recipes.find(x=>x.id===m.recetteId);
  return `<button class="cell filled" onclick="editMeal('${d}','${repas}')">${r?esc(r.nom):"—"}<span class="who">${parts} portion${parts>1?"s":""} · ${m.convives.length} pers.</span></button>`;
}
function partsOf(ids){ return PERSONNES.filter(p=>ids.includes(p.id)).reduce((s,p)=>s+p.parts,0); }

function editMeal(d, repas) {
  const key = d + "|" + repas;
  const m = S.meals[key] || { recetteId:null, convives:[], special:null };
  openSheet(`
    <h3>${fmtD(d)} · ${repas==="midi"?"Midi":"Soir"} <button class="close" onclick="closeSheet()">✕</button></h3>
    <div class="lbl">Qui mange ?</div>
    <div class="row">
      ${PERSONNES.map(p=>`
        <button class="person ${m.convives.includes(p.id)?'on':''}" onclick="toggleConvive('${key}','${p.id}')">
          <span class="e">${p.emoji}</span>${p.label}<span class="p">${p.parts} portion</span>
        </button>`).join("")}
    </div>
    <button class="optline" style="margin-top:8px;text-align:center;color:#a8a29e" onclick="setMealEmpty('${key}')">Option « vide » — personne ne mange à la maison 🚫</button>
    ${m.convives.length ? `
      <div class="lbl">Plat principal</div>
      ${S.recipes.map(r=>`
        <button class="optline" onclick="setMealRecipe('${key}','${r.id}')"
          style="${m.recetteId===r.id?'border-color:var(--indigo);background:#eef2ff':''}">
          ${esc(r.nom)}
          <span class="tagrow">${(r.tags||[]).map(t=>`<span class="pill" style="${TAGS[t].css}">${TAGS[t].label}</span>`).join("")}</span>
        </button>`).join("")}
      ${S.recipes.length ? "" : `<p style="font-size:12px;color:var(--muted)">Aucune recette — créez-en une juste en dessous 👇</p>`}
      <button class="optline" style="color:var(--indigo);text-align:center;border-color:#c7d2fe" onclick="askNewRecipeFromMeal('${key}')">＋ Créer une nouvelle recette pour ce repas…</button>
      <button class="optline" style="color:#7c3aed;text-align:center;border-color:#ddd6fe" onclick="askSpecial('${key}')">🎉 Repas spécial (anniversaire, invités…)</button>
    ` : ""}
  `);
}
function toggleConvive(key, pid) {
  const m = S.meals[key] || { recetteId:null, convives:[], special:null };
  m.convives = m.convives.includes(pid) ? m.convives.filter(x=>x!==pid) : [...m.convives, pid];
  S.meals[key] = m; save(); editMeal(...key.split("|"));
}
function setMealEmpty(key){ S.meals[key] = { recetteId:null, convives:[], special:null }; save(); closeSheet(); render(); }
function setMealRecipe(key, rid){
  const m = S.meals[key] || {}; m.recetteId = rid; m.special = null;
  S.meals[key] = m; save(); closeSheet(); render();
  toast("Repas ajouté — pensez à régénérer la liste 🛒");
}
function askSpecial(key) {
  openSheet(`
    <h3>Repas spécial <button class="close" onclick="closeSheet()">✕</button></h3>
    <input class="field" id="sp-name" placeholder="Ex : anniversaire de Raphaëlle, invités…">
    <div style="height:12px"></div>
    <button class="btn btn-primary" onclick="saveSpecial('${key}')">Enregistrer</button>`);
}
function saveSpecial(key){
  const v = document.getElementById("sp-name").value.trim();
  if(!v) return;
  S.meals[key] = Object.assign({}, S.meals[key]||{}, { special:v, recetteId:null });
  save(); closeSheet(); render();
}
function askExtra() {
  openSheet(`
    <h3>Plat hors planning <button class="close" onclick="closeSheet()">✕</button></h3>
    <input class="field" id="ex-name" placeholder="Ex : gâteau chocolat pour samedi">
    <div style="height:12px"></div>
    <button class="btn btn-primary" onclick="saveExtra()">Ajouter</button>`);
}
function saveExtra(){
  const v = document.getElementById("ex-name").value.trim();
  if(!v) return;
  S.extras.push({ id:uid(), nom:v }); save(); closeSheet(); render();
}
function delExtra(id){ S.extras = S.extras.filter(x=>x.id!==id); save(); render(); }
function extraToList(id){
  const x = S.extras.find(e=>e.id===id);
  mergeIntoList([{ cat:"autres", nom:"Pour : "+x.nom, qte:"" }]);
  save(); go("courses"); toast("Ajouté à la liste");
}

// ---------- Génération de la liste (fusion + arrondi) ----------
function generateList() {
  const fusion = {};
  Object.entries(S.meals).forEach(([key, m]) => {
    if (!m.recetteId || !m.convives || !m.convives.length) return;
    const r = S.recipes.find(x=>x.id===m.recetteId);
    if (!r) return;
    const base = r.baseServings || 2;
    const f = partsOf(m.convives) / base;
    (r.ingredients||[]).forEach(ing => {
      if (isExclu(ing.nom)) return; // sel, poivre, huile d'olive, bouillon : jamais achetés
      const k = norm(ing.nom) + "|" + ing.unite;
      (fusion[k] = fusion[k] || { nom:ing.nom, unite:ing.unite, qte:0, cat:guessCat(ing.nom) }).qte += (ing.qte||0) * f;
    });
  });
  const generated = Object.values(fusion).map(v=>({
    id:uid(), cat:v.cat, nom:v.nom, qte:fmtQteList(v.qte, v.unite), checked:false, home:false
  }));
  // Report automatique des articles non cochés et non « déjà à la maison »
  const reportes = S.list.filter(i=>!i.checked && !i.home).map(i=>Object.assign({}, i, {id:uid()}));
  S.list = [...reportes, ...generated];
  save(); go("courses");
  toast("Liste générée : " + generated.length + " article(s) · " + reportes.length + " reporté(s)");
}
function norm(s){ return (s||"").toLowerCase().trim().replace(/\s+/g," "); }
// Ingrédients jamais transférés vers la liste de courses (fournitures de base)
const EXCLUS = ["sel","poivre","huile d'olive","cube de bouillon","bouillon cube","cubes de bouillon","bouillon en cube","cube de bouillon"];
function isExclu(nom){
  const n = norm(nom);
  return EXCLUS.some(x => n===x || n.startsWith(x) || (x.startsWith("huile d'olive") && n.startsWith("huile d'olive")));
}
function guessCat(nom){
  const n = norm(nom);
  if (/(bebe|bébé|couche|lait infantile|petit pot|baby|biberon|coton tige bebe)/.test(n)) return "bebe";
  if (/(riz|pate|pâtes|noix|noisette|amande|farine|sucre|quinoa|boulgour|semoule|lentille|pois chiche|couscous|cereale|céréale|huile|vinaigre|epice|épice|sel|miel|confiture|chocolat|cacao|levure|feuille brick|tortilla|gnocchi)/.test(n)) return "secs";
  if (/(tomate|concombre|butternut|oignon|citron|pomme|courge|carotte|poireau|salade|epinard|épinard|ail|poivron|courgette|aubergine|banane|orange|poire|fraise|radis|champignon|endive|brocoli|fenouil|navet|betterave|laitue|herbe|persil|basilic|avocat|mangue|melon|raisin|pruneau|abricot|peche|pêche|nectarine)/.test(n)) return "legumes";
  if (/(jambon|poulet|boeuf|bœuf|porc|saumon|cabillaud|crevette|lard|steak|dinde|veau|agneau|merlu|truite|chorizo|viande|haché|hache|saucisse|cotelette|côtelette)/.test(n)) return "viande";
  if (/(crème|creme|feta|emmental|beurre|yaourt|lait|fromage|mozzarella|parmesan|chevre|chèvre|œuf|oeuf|ricotta|gruyere|gruyère|reblochon|faisselle|comté|bleu|tome|creme dessert|chantilly)/.test(n)) return "laitage";
  if (/(savon|shampooing|dentifrice|douche|brosse|coton|mouchoir|deodorant|déodorant|hygiene|hygiène|bain|intime|maquillage|rasoir|papier toilette)/.test(n)) return "hygiene";
  if (/(eponge|éponge|papier|lessive|vaisselle|poubelle|sac|seau|nettoyant|grille|aluminium|film|essuie)/.test(n)) return "menage";
  return "autres";
}
function fmtQte(q, u){
  if (q<=0) return "";
  if (!u || u==="pièce" || u==="pièces") {
    const r = Math.max(1, Math.ceil(q*2)/2);
    return (r%1 ? r.toFixed(1) : r.toFixed(0)) + " pièce" + (r>1?"s":"");
  }
  if (u==="g"||u==="ml"||u==="cl") {
    const r = q>=100 ? Math.ceil(q/10)*10 : Math.max(1, Math.ceil(q));
    return r + " " + u;
  }
  return (Math.round(q*10)/10) + " " + u;
}
// Quantités pour la LISTE DE COURSES : pièces toujours arrondies à l'entier supérieur (minimum 1)
function fmtQteList(q, u){
  if (!u || u==="pièce" || u==="pièces") {
    const r = Math.max(1, Math.ceil(q));
    return r + " pièce" + (r>1?"s":"");
  }
  return fmtQte(q, u);
}
function mergeIntoList(items){
  items.forEach(it=>{
    const ex = S.list.find(c => norm(c.nom)===norm(it.nom) && !c.checked && !c.home);
    if (ex) {
      const a = parseQ(ex.qte), b = parseQ(it.qte);
      if (a && b && a.unite===b.unite && b.unite) ex.qte = fmtQteList(a.q + b.q, b.unite);
      else if (it.qte) ex.qte = ex.qte ? ex.qte + " + " + it.qte : it.qte;
    } else {
      S.list.push({ id:uid(), cat:it.cat||guessCat(it.nom), nom:it.nom, qte:it.qte||"", checked:false, home:false });
    }
  });
}
function parseQ(s){
  const m = String(s||"").match(/^([\d.,]+)\s*(.*)$/);
  return m ? { q:parseFloat(m[1].replace(",",".")), unite:m[2] } : null;
}

function resizePhoto(file, cb, max, q){
  max = max || 480; q = q || 0.75;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Réduction pour un stockage et un envoi légers
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", q));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

  const f = input.files && input.files[0];

async function fetchLinkImage(url){
  // Tente de récupérer l'image principale de la page (photo du plat)
  try {
    const r = await fetch("https://r.jina.ai/" + url, { headers:{ "X-Return-Format":"markdown" } });
    if (!r.ok) return null;
    const md = await r.text();
    // images markdown : ![alt](https://...) — on prend la première https
    const imgs = [...md.matchAll(/!\[[^\]]*\]\((https?:\/\/[^\s)]+\.(?:jpe?g|png|webp)[^\s)]*)\)/gi)].map(m=>m[1]);
    if (imgs.length) return imgs[0];
    return null;
  } catch(e) { return null; }
}

function mistralKey(){ return (S.settings && S.settings.mistralKey) || ""; }
function sleep(ms){ return new Promise(ok=>setTimeout(ok,ms)); }
async function mistralCall(body){
  // Appel API Mistral avec réessai automatique et détails d'erreur lisibles
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await fetch("https://api.mistral.ai/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + mistralKey() },
      body: JSON.stringify(body)
    });
    if (r.ok) return r.json();
    let detail = "";
    try { const j = await r.json(); detail = (j.message || "") + (j.code ? " (code " + j.code + ")" : ""); } catch(e) {}
    if (r.status === 429 && attempt < 2) {
      setExtractStatus("⏳ Limite atteinte — nouvel essai (" + (attempt+1) + "/3)… " + detail);
      await sleep(5000 * (attempt + 1));
      continue;
    }
    if (r.status === 401) throw new Error("clé API invalide — vérifiez la clé dans Réglages");
    if (r.status === 402) throw new Error("crédits épuisés sur le compte Mistral (console.mistral.ai)");
    throw new Error("API Mistral " + r.status + " : " + (detail || "erreur inconnue"));
  }
  throw new Error("limite atteinte après 3 essais — " + (detail || "réessayez dans une minute"));
}
async function mistralJSON(text, source){
  // Essai sur plusieurs modèles : si l'un est saturé sur le palier gratuit, on passe au suivant
  const models = ["mistral-small-latest", "open-mistral-nemo", "ministral-8b-latest"];
  let lastErr = null;
  for (const model of models) {
    try {
      const j = await mistralCall({
        model: model,
        messages:[
          { role:"system", content:"Tu extrais une recette de cuisine. Réponds UNIQUEMENT avec du JSON valide, sans markdown, au format {\"nom\":\"\", \"baseServings\":2, \"ingredients\":[{\"nom\":\"\",\"qte\":0,\"unite\":\"g\"}], \"etapes\":[\"\"], \"tags\":[]}. Unités possibles : g, ml, cl, pièce. Tags possibles : vege, rapide, viande, poisson, hiver, ete, automne, printemps, dessert, favoris. Si une information est absente, laisse le champ vide ou 0." },
          { role:"user", content:"Source : " + source + "\n\n" + text.slice(0, 6000) }
        ],
        temperature:0
      });
      let txt = j.choices[0].message.content.trim();
      if (txt.startsWith("```")) txt = txt.replace(/```[a-z]*\n?/g,"").trim();
      const start = txt.indexOf("{"), end = txt.lastIndexOf("}");
      return JSON.parse(txt.slice(start, end+1));
    } catch(e) { lastErr = e; if (String(e.message).includes("401") || String(e.message).includes("402")) throw e; }
  }
  throw lastErr || new Error("tous les modèles sont limités — réessayez dans une minute");
}

  window._draftPhoto = window._draftPhoto !== undefined ? window._draftPhoto : null;
  window._draft = {
    nom: d.nom || "",
    baseServings: d.baseServings || 2,
    ingredients: (d.ingredients||[]).map(i=>({ nom:i.nom||"", qte:i.qte||0, unite:i.unite||"pièce" })).filter(i=>i.nom),
    etapes: d.etapes || [],
    tags: (d.tags||[]).filter(t=>TAGS[t]),
    source: source || ""
  };
  openSheet(`
    <h3>Recette extraite — vérifiez puis enregistrez <button class="close" onclick="closeSheet()">✕</button></h3>
    <p style="font-size:11px;color:var(--muted);margin-bottom:6px">✨ L'IA a lu la source : relisez, corrigez, puis enregistrez.</p>
    ${recipeForm(window._draft)}`);

async function extractFromLink(){
  const url = (document.getElementById("nr-link").value||"").trim();
  if (!url) return;
  if (!mistralKey()) { toast("Renseignez d'abord la clé Mistral dans Réglages ⚙️"); return; }
  setExtractStatus("⏳ Extraction en cours…");
  try {
    let text;
    if (/\.(jpe?g|png|webp|pdf)(\?|$)/i.test(url)) {
      text = await ocrDocument(url);
    } else {
      const r = await fetch("https://r.jina.ai/" + url);
      if (!r.ok) throw new Error("lecture du lien impossible");
      text = await r.text();
      if (text.length > 12000) text = text.slice(0, 12000);
    }
    const d = await mistralJSON(text, url);
    fillDraft(d, url);
    // Récupération de la photo du plat depuis la page
    setExtractStatus("⏳ Récupération de la photo…");
    const imgUrl = await fetchLinkImage(url);
    window._draftPhoto = imgUrl ? proxyImg(imgUrl) : null;
    fillDraft(d, url);
    setExtractStatus(imgUrl ? "Photo du plat récupérée ✓ (modifiable)" : "Aucune photo trouvée sur la page — ajoutez-la manuellement");
  } catch(e) { setExtractStatus("❌ " + (e.message||"Extraction impossible. Vérifiez le lien et la clé Mistral.")); }
}
// Appel OCR avec réessais et messages d'erreur explicites
async function ocrCall(page){
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await fetch("https://api.mistral.ai/v1/ocr", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + mistralKey() },
      body: JSON.stringify({ model:"mistral-ocr-latest", pages:[page] })
    });
    if (r.ok) return r.json();
    let detail = "";
    try { const j = await r.json(); detail = (j.message || (j.detail && JSON.stringify(j.detail).slice(0,120))) || ""; } catch(e) {}
    if (r.status === 429 && attempt < 2) {
      setExtractStatus("⏳ Limite atteinte — nouvel essai (" + (attempt+1) + "/3)…");
      await sleep(5000 * (attempt + 1));
      continue;
    }
    if (r.status === 401) throw new Error("clé API invalide — vérifiez la clé dans Réglages");
    if (r.status === 402) throw new Error("crédits épuisés sur le compte Mistral (console.mistral.ai)");
    if (r.status === 422) throw new Error("photo refusée par l'OCR (format ou taille). La photo est maintenant convertie automatiquement — retentez ; sinon essayez une photo plus nette et bien cadrée");
    if (r.status === 413) throw new Error("photo trop lourde — prenez une photo de plus près, la page en entier");
    throw new Error("OCR " + r.status + " : " + (detail || "erreur inconnue"));
  }
  throw new Error("limite atteinte après 3 essais — réessayez dans une minute");
}
async function extractFromPhoto(input){
  const f = input.files && input.files[0];
  if (!f) return;
  if (!mistralKey()) { toast("Renseignez d'abord la clé Mistral dans Réglages ⚙️"); input.value=""; return; }
  setExtractStatus("⏳ Préparation de la photo…");
  try {
    // Conversion systématique en JPEG compact (corrige le refus des formats HEIC/très lourds)
    const dataUrl = await new Promise((ok,ko)=> resizePhoto(f, ok, 1280, 0.85));
    setExtractStatus("⏳ Lecture OCR de la photo…");
    const j = await ocrCall({ type:"image_url", image_url: dataUrl });
    const text = (j.pages||[]).map(p=>p.markdown||"").join("\n");
    if (!text.trim()) throw new Error("photo illisible — prenez la photo de plus près, à la lumière");
    setExtractStatus("⏳ Structuration de la recette…");
    const d = await mistralJSON(text, "photo");
    fillDraft(d, "");
  } catch(e) { setExtractStatus("❌ " + (e.message||"Extraction impossible. Vérifiez la photo et la clé Mistral.")); }
  input.value = "";
}
async function ocrDocument(url){
  const j = await ocrCall({ type:"document_url", document_url: url });
  return (j.pages||[]).map(p=>p.markdown||"").join("\n");
}

function importRecipes(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      const list = j.recipes || (Array.isArray(j) ? j : null);
      if (!list) throw new Error("format inconnu");
      let added = 0, updated = 0;
      list.forEach(r=>{
        if (!r.nom) return;
        const clean = {
          id: uid(), nom:r.nom, baseServings:r.baseServings||2,
          ingredients:(r.ingredients||[]).map(i=>({nom:i.nom||"",qte:i.qte||0,unite:i.unite||"pièce"})).filter(i=>i.nom),
          etapes:r.etapes||[], tags:(r.tags||[]).filter(t=>TAGS[t]), source:r.source||""
        };
        const i = S.recipes.findIndex(x=>norm(x.nom)===norm(r.nom));
        if (i>=0) { S.recipes[i] = clean; updated++; } else { S.recipes.push(clean); added++; }
      });
      save(); render(); toast("Import : "+added+" ajoutée(s), "+updated+" mise(s) à jour ✓");
    } catch(e){ toast("Import impossible : fichier invalide"); }
    input.value = "";
  };
  fr.readAsText(f);
}

// ============================================================
// SYNCHRONISATION (Supabase) — locale d'abord, cloud ensuite
// ============================================================
let sb = null, pushTimer = null;
async function initSync(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { updateSyncStatus(); return; }
  try {
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await pull();
    render();
    sb.channel("foyer-"+FOYER).on("postgres_changes",
      { event:"*", schema:"public", table:"app_state", filter:"foyer=eq."+FOYER },
      (payload) => { if (payload.new && payload.new.foyer===FOYER) applyRemote(payload.new.data); }
    ).subscribe();
  } catch(e) { console.warn("Sync indisponible (hors ligne ou mode local)", e); }
  updateSyncStatus();
}
function loadScript(src){
  return new Promise((ok,ko)=>{
    if (window.supabase) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
}
async function pull(){
  if (!sb) return;
  const { data } = await sb.from("app_state").select("data, updated_at").eq("foyer", FOYER).maybeSingle();
  if (data) applyRemote(data.data);
}
function applyRemote(remote){
  if (!remote) return;
  // « dernière écriture gagne » — suffisant pour un foyer de 2 personnes
  if ((remote._rev||0) > (S._rev||0)) {
    S = Object.assign(structuredClone(DEFAULT_STATE), remote);
    render();
  }
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 1200); }
async function pushNow(manual){
  if (!sb) { if (manual) toast("Mode local — partage temps réel dès que les clés Supabase seront configurées"); updateSyncStatus(); return; }
  S._rev = Date.now();
  try {
    await sb.from("app_state").upsert({ foyer:FOYER, data:S, updated_at:new Date().toISOString() });
    if (manual) toast("Synchronisé avec le foyer ✓");
  } catch(e) { if (manual) toast("Synchro impossible : hors ligne ?"); }
  updateSyncStatus();
}
function updateSyncStatus(){
  const el = document.getElementById("sync-status"); if(!el) return;
  el.innerHTML = sb
    ? `✅ Connectée — planning, recettes et listes partagés en temps réel avec ta compagne.`
    : `📱 Mode local (données sur cet appareil, hors ligne OK).<br><span style="font-size:11px;color:var(--muted)">Pour le partage temps réel : crée le projet Supabase, colle l'URL et la clé anon dans les 2 lignes SUPABASE_* du fichier, et déployez sur GitHub Pages. Guide détaillé fourni.</span>`;
}
window.addEventListener("online", ()=>{ document.getElementById("syncbar").style.display="none"; pushNow(); });
window.addEventListener("offline", ()=>{ document.getElementById("syncbar").style.display="block"; });
